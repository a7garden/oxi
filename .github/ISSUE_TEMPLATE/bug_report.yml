name: Bug Report
description: Report a bug in oxicode
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: oxicode Version
      description: Output of `oxicode --version`
      placeholder: "oxicode 0.20.0"
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`
      placeholder: "rustc 1.82.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (aarch64)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: LLM Provider
      description: Which provider(s) are affected?
      placeholder: "anthropic, openai, google, ..."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `oxicode -p openai -m gpt-4o`
        2. Enter prompt "..."
        3. Observe error "..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Paste any relevant log output. **Redact sensitive data** (API keys, personal info).
      render: shell
