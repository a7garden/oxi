version: 2

# Group all cargo patches into a single weekly PR to reduce noise.
# Without groups, a single transitive bump can produce 3-5 separate PRs.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - "dependencies"
      - "area: ci"
    groups:
      cargo-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      cargo-major-bumps:
        patterns:
          - "*"
        update-types:
          - major
    # Bump MSRV-pinned deps only when they don't increase the floor.
    ignore:
      - dependency-name: "tokio"
        versions: ["=1.43.0"]
      - dependency-name: "extism"
        # wasmtime advisories are managed in .cargo/audit.toml + deny.toml
        # Track extism 1.22+ to drop RUSTSEC-2026-* ignore list.
      # self_update 0.44+ has an internal compile break (http_client::get
      # removed). The crate is declared but never called from oxicode-cli src/.
      # Re-evaluate when self_update ships a working release.
      - dependency-name: "self_update"
        versions: [">= 0.44"]
      # RustCrypto stack (sha2/digest/hmac/signature/pkcs8) must stay
      # version-aligned with rsa 0.9.x, which depends on digest 0.10.
      # Bumping these to 0.11/3.0 breaks rsa until rsa 0.10 (digest 0.11)
      # has a stable release. Track RustCrypto/traits#2400.
      - dependency-name: "sha2"
        versions: [">= 0.11"]
      - dependency-name: "digest"
        versions: [">= 0.11"]
      - dependency-name: "hmac"
        versions: [">= 0.13"]
      - dependency-name: "signature"
        versions: [">= 3.0"]
      - dependency-name: "pkcs8"
        versions: [">= 0.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - "dependencies"
      - "area: ci"
    groups:
      actions-deps:
        patterns:
          - "*"

  # Cargo.lock is tracked (oxicode-cli is a binary distribution), so we want
  # cargo updates to flow through the lockfile directly.
