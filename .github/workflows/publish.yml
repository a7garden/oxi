name: Publish to crates.io

# Single workflow: push a v* tag to publish all crates in topological order.
# No binary builds, no GitHub Release, no self-hosted runners.
#
# Required secrets:
#   CARGO_TOKEN or CARGO_REGISTRY_TOKEN — crates.io publish token
#     (https://crates.io/settings/tokens, scope: publish)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — verify packaging only, skip publish"
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Tag ancestry check ────────────────────────────────────────
  # Rejects tags that don't point at origin/main (stale/force-pushed).
  tag-check:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag points at main HEAD
        run: |
          TAG="${GITHUB_REF_NAME}"
          # workflow_dispatch from a branch → use latest Release tag
          if [[ "$TAG" != v* ]]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          fi
          if [[ "$TAG" == v* ]]; then
            git fetch origin main
            git fetch origin "$TAG" 2>/dev/null || true
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null || echo "")
            if [ -z "$TAG_SHA" ] || ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
              echo "::error::Tag $TAG is not on main."
              exit 1
            fi
            echo "Tag $TAG is on main. OK."
          else
            echo "Not a v* tag. Skipping ancestry check."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dry-run packaging check (leaf crates) ────────────────────
  # Runs for every trigger (even dry_run workflow_dispatch).
  # Only the leaf crates (no oxi-* dependencies) can be packaged
  # standalone here — the others depend on oxi-* versions that
  # aren't on crates.io yet at this point. Their packaging is
  # validated implicitly by `cargo publish` in the publish job.
  package-check:
    needs: tag-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify each crate packages cleanly
        run: |
          for crate in oxi-hashline oxi-sandbox oxi-ai oxi-tui oxi-lsp oxi-mnemopi oxi-snapcompact; do
            echo "─── $crate ───"
            (cd "$crate" && cargo package)  # verifies build + packaging (drops --no-verify --list)
          done

  # ── Correctness gate ─────────────────────────────────────────
  # Mirrors ci.yml (fmt + clippy) and test.yml (nextest). Publish MUST NOT
  # proceed if the workspace fails its own quality gate. Uses the pinned MSRV
  # (1.96) so the lint result matches ci.yml exactly.
  verify:
    name: fmt + clippy + nextest
    needs: tag-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish-verify"
      - uses: taiki-e/install-action@nextest
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --profile ci

  # ── Publish in topological order ─────────────────────────────
# Matrix with max-parallel: 1 enforces order: oxi-hashline →
# oxi-ai → oxi-tui → oxi-mnemopi → oxi-snapcompact → oxi-lsp →
# oxi-agent → oxi-sdk → oxi-pager → oxi-cli.
# Each crate waits for its dependency's crates.io index to
# propagate (~30-60s) before publishing.
  publish:
    name: publish ${{ matrix.crate }}
    needs: [tag-check, package-check, verify]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        crate:
          - oxi-hashline
          - oxi-sandbox
          - oxi-ai
          - oxi-tui
          - oxi-lsp
          - oxi-mnemopi
          - oxi-snapcompact
          - oxi-agent
          - oxi-sdk
          - oxi-pager
          - oxi-cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for crates.io index to see dependency
        # Poll crates.io API for the exact new version of the
        # internal dependency published immediately before this crate.
        run: |
          CRATE="${{ matrix.crate }}"
          # Define wait targets per crate (space-separated for multiple deps).
          case "$CRATE" in
            oxi-sandbox|oxi-hashline|oxi-ai|oxi-tui|oxi-lsp|oxi-mnemopi|oxi-snapcompact) exit 0 ;;
            oxi-agent) WAITS="oxi-ai oxi-hashline" ;;
            oxi-sdk) WAITS="oxi-agent oxi-snapcompact" ;;
            oxi-pager) WAITS="oxi-agent oxi-ai oxi-tui" ;;
            oxi-cli) WAITS="oxi-sdk oxi-mnemopi oxi-lsp oxi-pager" ;;
            *) exit 0 ;;
          esac
          for WAIT in $WAITS; do
            TARGET=$(grep -E "^${WAIT} = \{ version = " "$CRATE/Cargo.toml" \
              | head -1 | sed -E 's/.*version = "([^"]+)".*/\1/')
            [ -z "$TARGET" ] && echo "::error::Could not determine required version of $WAIT" && exit 1
            echo "Waiting for $WAIT $TARGET on crates.io..."
            for i in $(seq 1 60); do
              SEEN=$(curl -fsSL -H "User-Agent: oxi-publish-ci/1.0" \
                "https://crates.io/api/v1/crates/$WAIT" \
                | grep -oE '"max_stable_version":[[:space:]]*"[^"]+"' \
                | head -1 | sed -E 's/.*:[[:space:]]*"([^"]+)".*/\1/')
              [ "$SEEN" = "$TARGET" ] && echo "$WAIT $TARGET visible" && break
              echo "  waiting for $WAIT $TARGET (saw $SEEN)... ($i/60)"
              sleep 10
            done
            if [ "$SEEN" != "$TARGET" ]; then
              echo "::error::Timeout waiting for $WAIT $TARGET"
              exit 1
            fi
          done

      - name: Publish ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_TOKEN / CARGO_REGISTRY_TOKEN not set."
            exit 1
          fi
          # Idempotent: skip if this version is already published.
          set +e
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}; set -e
          [ "$status" -eq 0 ] && exit 0
          if grep -qiE "already exists|already uploaded|already been published" /tmp/publish.log; then
            echo "::notice::${{ matrix.crate }} is already published; skipping."
            exit 0
          fi
          exit "$status"
