name: Test

# Full test matrix — runs on every PR and on every push to main.
# Replaces the old "smoke-on-PR, full-on-main" split. The original
# `smoke-test` job in ci.yml remains for the very-fast feedback path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  # Fail doc-test builds on any rustdoc warning (broken links, etc.)
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (nextest, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        # Windows MSVC runners need an explicit linker setup for some
        # crates that pull in native deps; the default works for the
        # current workspace. If a new crate adds a native dep, document
        # the extra `shell: pwsh` step in its README.
        run: cargo nextest run --workspace --profile ci

  test-doc:
    name: Doc Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-doc"
      - name: Run doc tests
        run: cargo test --workspace --doc
