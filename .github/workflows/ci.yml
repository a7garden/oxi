name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback jobs (run in parallel) ─────────────────────────

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      - run: cargo clippy --workspace -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit && cargo audit

  deny:
    name: Dependency Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny && cargo deny check

  # ── Test jobs (run in parallel batches) ─────────────────────────
  # Split tests into 3 batches for parallel execution on 2-core runners.
  # Each batch runs 2 crates simultaneously, reducing total CI time.
  #
  # Batch 1: oxi-ai + oxi-agent (~900 tests, heaviest)
  # Batch 2: oxi-tui + oxi-sdk (~400 tests)
  # Batch 3: oxi-cli + oxi-store (~400 tests)
  #
  # Estimated improvement: ~20min → ~8-10min (2-2.5x faster)

  test-batch-1:
    name: Test (oxi-ai, oxi-agent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: |
          cargo nextest run -p oxi-ai -p oxi-agent --workspace --profile ci

  test-batch-2:
    name: Test (oxi-tui, oxi-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: |
          cargo nextest run -p oxi-tui -p oxi-sdk --workspace --profile ci

  test-batch-3:
    name: Test (oxi-cli, oxi-store)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: |
          cargo nextest run -p oxi-cli -p oxi-store --workspace --profile ci

  test-doc:
    name: Doc Tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-doc"
      - name: Run doc tests
        run: cargo test --workspace --doc

  # ── Build jobs (run in parallel) ─────────────────────────────────

  build-release:
    name: Build (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-release"
      - name: Build release binary
        run: cargo build --release -p oxi-cli
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
