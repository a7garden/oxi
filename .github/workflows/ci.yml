name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Default MSRV — overwritable per job via `dtolnay/rust-toolchain`.
  RUST_VERSION_STABLE: stable
  RUST_VERSION_MSRV: "1.96"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback (blocks merge) ───────────────────────────────
  # These jobs run in ~2-3 minutes total and provide fast signal.

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      # NOTE: We intentionally stay on `cargo clippy --workspace` (no
      # --all-targets) because test/bench code still uses a few `unwrap()`
      # and other clippy::pedantic lints. Upgrading to --all-targets
      # is tracked as a follow-up — see AGENTS.md "Pre-existing TODO".
      - run: cargo clippy --workspace -- -D warnings

  smoke-test:
    name: Smoke Test (PR only)
    # Lightweight subset of tests for PR feedback. Full matrix runs in
    # `test.yml` on push to main. Skips tests tagged `slow` or `net`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "smoke-test"
      - uses: taiki-e/install-action@nextest
      - name: Run smoke tests
        # Exclude long-running / network-dependent tests; those run in test.yml
        # against the full nextest CI profile (20-min timeout).
        run: |
          cargo nextest run --workspace \
            -E 'not (test(slow) | test(/^net_/) | test(requires_network) | test(/^bench_/))'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: Dependency Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # ── MSRV verification (no -D warnings so transient toolchain
  #    warnings don't block; we only check that it BUILDS at MSRV).
  msrv:
    name: MSRV (${{ env.RUST_VERSION_MSRV }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"
      - name: Verify workspace builds at MSRV
        # Override RUSTFLAGS so we don't treat legacy-toolchain warnings
        # as build errors. This job's purpose is buildability, not lint.
        env:
          RUSTFLAGS: ""
        run: |
          cargo build --workspace --locked \
            2>&1 | tee msrv-build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::MSRV build failed on Rust ${{ env.RUST_VERSION_MSRV }}."
            echo "::error::Bump MSRV in README.md and AGENTS.md, or remove the constraint that requires this version."
            exit 1
          fi

  # ── Documentation build (blocks doc-rot before it lands) ───────
  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "doc"
      - name: Build docs (treat warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
