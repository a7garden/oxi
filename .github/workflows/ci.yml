name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The workspace `rust-toolchain.toml` pins `channel = "1.96"`, which
  # overrides whatever `dtolnay/rust-toolchain` installs.  Every job
  # therefore MUST install 1.96 explicitly (with the components it
  # needs) — installing stable + clippy does nothing because cargo
  # picks 1.96 from the override and finds no components there.
  RUST_VERSION_MSRV: "1.96"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback (blocks merge) ───────────────────────────────
  # These jobs run in ~2-3 minutes total and provide fast signal.

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (fontconfig for blitz-paint via oxibrowser-render)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      # Lint the full target set: lib + bins + tests + benches + examples.
      # Test code relaxes exactly two test-idiom lints (`clippy::unwrap_used`
      # and `clippy::field_reassign_with_default`) via
      # `#![cfg_attr(test, allow(...))]` at each library crate root; shipped
      # library code stays strict. See AGENTS.md "Code Style" for rationale.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy-native-browser:
    name: Clippy (native-browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (fontconfig for blitz-paint via oxibrowser-render)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy-native-browser"
      # `native-browser` is now a default feature of `oxicode-cli` (browsing is
      # a product capability, not an SDK contract — the SDK no longer carries
      # browser tooling).  This feature compiles `oxibrowser_backend.rs`, the
      # pure-Rust headless browser backend.  The path was previously never
      # CI-verified, which let edition-2024 lifetime bugs ship to crates.io
      # (0.32.0–0.34.0); this job keeps it green.  Runtime tests (actual
      # browser execution) run locally only — they need a display and are not
      # reproducible in a headless CI runner.
      - run: cargo clippy -p oxicode-cli -- -D warnings
      - run: cargo build -p oxicode-agent --features native-browser

  smoke-test:
    name: Smoke Test (PR only)
    # Lightweight subset of tests for PR feedback. Full matrix runs in
    # `test.yml` on push to main. Skips tests tagged `slow` or `net`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "smoke-test"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libfontconfig1-dev libdbus-1-dev
      - uses: taiki-e/install-action@nextest
      - name: Run smoke tests
        # Exclude long-running / network-dependent tests; those run in test.yml
        # against the full nextest CI profile (20-min timeout).
        run: |
          cargo nextest run --workspace \
            -E 'not (test(slow) | test(/^net_/) | test(requires_network) | test(/^bench_/))'

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: Dependency Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # ── MSRV verification (no -D warnings so transient toolchain
  #    warnings don't block; we only check that it BUILDS at MSRV).
  msrv:
    # NOTE: GitHub Actions does not allow the `env` context in the
    # `name` field (only github/inputs/matrix/needs/strategy/vars).
    # Hardcode the MSRV here; keep in sync with `RUST_VERSION_MSRV` above
    # and `rust-toolchain.toml`.
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libfontconfig1-dev libdbus-1-dev
      - name: Verify workspace builds at MSRV
        # Override RUSTFLAGS so we don't treat legacy-toolchain warnings
        # as build errors. This job's purpose is buildability, not lint.
        env:
          RUSTFLAGS: ""
        run: |
          cargo build --workspace --locked \
            2>&1 | tee msrv-build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::MSRV build failed on Rust ${{ env.RUST_VERSION_MSRV }}."
            echo "::error::Bump MSRV in README.md and AGENTS.md, or remove the constraint that requires this version."
            exit 1
          fi

  # ── Documentation build (blocks doc-rot before it lands) ───────
  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "doc"
      - name: Install system deps (fontconfig for blitz-paint via oxibrowser-render)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libdbus-1-dev
      - name: Build docs (treat warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
