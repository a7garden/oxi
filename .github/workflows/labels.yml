name: Sync Labels

# Keep .github/labels.yml as the single source of truth for the issue/PR
# label set. Runs weekly to pick up manual edits, plus on demand.

on:
  workflow_dispatch:
  schedule:
    # Sunday 02:00 UTC — well before Monday's dependabot runs at 09:00 KST.
    - cron: "0 2 * * 0"
  push:
    paths:
      - ".github/labels.yml"

permissions:
  issues: write

jobs:
  sync:
    name: Apply label set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply labels
        # EndBug/label-sync syncs the repo's label set to a declarative
        # config file. Its `name`/`color`/`description`/`aliases` schema
        # matches .github/labels.yml exactly (the previous step used
        # `github/issue-labeler`, a different action with a deleted v2 tag
        # that classifies issues rather than managing the label set).
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          # Preserve any extra labels that exist in the repo but aren't in
          # the config — avoids wiping hand-created labels.
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
