name: Build Binaries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS Apple Silicon (only supported target) ──
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: oxi
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }} \
            -p oxi-cli

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../oxi-${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: oxi-${{ matrix.target }}
          path: oxi-${{ matrix.target }}.${{ matrix.archive_ext }}
