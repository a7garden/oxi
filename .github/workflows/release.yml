name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: true
          # ── macOS ──
          # macos-14 is the first ARM-only runner line; x86_64-apple-darwin
          # is produced via Apple's cross-linker (--target x86_64-apple-darwin
          # is handled by the dtolnay/rust-toolchain step above).
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-14
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          # ── Windows ──
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: oxi.exe
            archive_ext: zip
            use_cross: false

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: |
          ${{ matrix.use_cross && 'cross' || 'cargo' }} build \
            --release \
            --target ${{ matrix.target }} \
            -p oxi-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          strip ${{ matrix.artifact_name }} || true
          tar czf ../../../${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.target }}.zip ${{ matrix.artifact_name }}
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    name: Publish Release
    # Block release on test workflow — releases must come from a green main.
    # Tag pushes from a branch that hasn't passed test.yml will be rejected.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify tag points at main HEAD
        # Defensive: protect against force-pushed tags from stale branches.
        # Checks that the tagged commit is an ancestor of (or equal to) origin/main.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from origin/main."
            echo "::error::Refusing to release a tag that does not point at a main commit."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main. OK."

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
