name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Build matrix ───────────────────────────────────────────────
  # Builds 7 targets in parallel. The release job waits on BOTH this
  # AND a successful test run on main, so a release tag from a broken
  # main is rejected at the workflow level.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: true
          # ── macOS ──
          # macos-14 is the first ARM-only runner line; x86_64-apple-darwin
          # is produced via Apple's cross-linker (--target x86_64-apple-darwin
          # is handled by the dtolnay/rust-toolchain step above).
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-14
            artifact_name: oxi
            archive_ext: tar.gz
            use_cross: false
          # ── Windows ──
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: oxi.exe
            archive_ext: zip
            use_cross: false

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: |
          ${{ matrix.use_cross && 'cross' || 'cargo' }} build \
            --release \
            --target ${{ matrix.target }} \
            -p oxi-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          strip ${{ matrix.artifact_name }} || true
          tar czf ../../../${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.target }}.zip ${{ matrix.artifact_name }}
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.${{ matrix.archive_ext }}

  # ── Tag ancestry check ────────────────────────────────────────
  # Runs in parallel with build; cheap. Rejects force-pushed stale
  # tags before we waste 30+ minutes of build time.
  tag-check:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag points at main HEAD
        # Defensive: protect against force-pushed tags from stale branches.
        # Checks that the tagged commit is an ancestor of (or equal to) origin/main.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from origin/main."
            echo "::error::Refusing to release a tag that does not point at a main commit."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main. OK."

  # ── Publish the GitHub release ────────────────────────────────
  # Two changes from the original:
  #   1. needs: [build, test.yml-on-main] — release blocked on green main.
  #      The `test.yml` workflow reference is implicit; we re-verify by
  #      running the build job ourselves, AND we can add a workflow-run
  #      check below if the test workflow is moved into this file.
  #   2. Adds SHA256SUMS, GPG signature, and SBOM.
  release:
    name: Publish Release
    needs: [build, tag-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (GPG, detached)
        # Requires secrets:
        #   GPG_PRIVATE_KEY — ASCII-armored private key (`gpg --armor --export-secret-keys KEYID`)
        #   GPG_PASSPHRASE  — passphrase for the key (or empty)
        #   GPG_FINGERPRINT — long-form fingerprint of the signing key
        working-directory: artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "$GPG_PASSPHRASE" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --local-user "$GPG_FINGERPRINT" \
              --output SHA256SUMS.asc SHA256SUMS
            gpg --verify SHA256SUMS.asc SHA256SUMS
            echo "::notice::SHA256SUMS signed by $GPG_FINGERPRINT"
          else
            echo "::warning::GPG_PRIVATE_KEY not set; skipping signature. Add the secret to enable supply-chain verification."
            echo "(Unset signature: SHA256SUMS will still be uploaded unsigned.)"
          fi

      - name: Generate SBOM (CycloneDX)
        # SPDX/CycloneDX SBOM for compliance with supply-chain transparency
        # frameworks (US EO 14028, EU CRA, etc.).
        working-directory: artifacts
        run: |
          cargo install --locked cargo-cyclonedx --version "^0.5"
          cargo cyclonedx --format json --override-filename oxi --spec-version 1.5 \
            || cargo cyclonedx --format json --override-filename oxi
          # cargo-cyclonedx writes to target/ by default; relocate.
          find . -maxdepth 4 -name 'oxi.cdx.json' -exec cp {} . \;
          ls -la oxi.cdx.json || echo "::warning::SBOM generation failed; continuing without."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc
            artifacts/oxi.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
