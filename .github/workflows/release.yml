name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  # `actions: write` lets the `trigger-publish` job dispatch publish.yml
  # via `gh workflow run` (same-repo dispatch works with GITHUB_TOKEN).
  actions: write

jobs:
  # ── Build matrix ───────────────────────────────────────────────
  # Builds 7 targets in parallel. The release job waits on BOTH this
  # AND a successful test run on main, so a release tag from a broken
  # main is rejected at the workflow level.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS Apple Silicon (only supported target) ──
          # Scope decision (2026-06-07): the maintainer does not have
          # access to Linux or Windows build environments, so cross-OS
          # verification is not part of this pipeline. To re-enable
          # other targets, add an entry to this matrix and a matching
          # test runner in test.yml.
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: oxi
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }} \
            -p oxi-cli

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          strip ${{ matrix.artifact_name }} || true
          tar czf ../../../${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.${{ matrix.archive_ext }}

  # ── Tag ancestry check ────────────────────────────────────────
  # Runs in parallel with build; cheap. Rejects force-pushed stale
  # tags before we waste 30+ minutes of build time.
  tag-check:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify tag points at main HEAD
        # Defensive: protect against force-pushed tags from stale branches.
        # Checks that the tagged commit is an ancestor of (or equal to) origin/main.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from origin/main."
            echo "::error::Refusing to release a tag that does not point at a main commit."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main. OK."

  # ── Publish the GitHub release ────────────────────────────────
  # Two changes from the original:
  #   1. needs: [build, test.yml-on-main] — release blocked on green main.
  #      The `test.yml` workflow reference is implicit; we re-verify by
  #      running the build job ourselves, AND we can add a workflow-run
  #      check below if the test workflow is moved into this file.
  #   2. Adds SHA256SUMS, GPG signature, and SBOM.
  release:
    name: Publish Release
    needs: [build, tag-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SBOM (CycloneDX)
        # SPDX/CycloneDX SBOM for compliance with supply-chain transparency
        # frameworks (US EO 14028, EU CRA, etc.).
        # cargo-cyclonedx writes one `oxi.json` per workspace member into
        # each crate dir; oxi-cli pulls in the whole dep tree.
        run: |
          cargo install --locked cargo-cyclonedx --version "^0.5"
          cargo cyclonedx --format json --override-filename oxi --spec-version 1.5
          cp oxi-cli/oxi.json artifacts/oxi.cdx.json
          rm -f oxi-*/oxi.json
          ls -la artifacts/oxi.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS
            artifacts/oxi.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Trigger crates.io publish ──────────────────────────────────
  # A Release created with GITHUB_TOKEN does NOT emit a `release: published`
  # event to other workflows (GitHub suppresses this to prevent loops), so
  # publish.yml's `on: release` trigger never fires. Dispatch it explicitly
  # here once the Release is live. publish.yml verifies the Release exists
  # before publishing.
  trigger-publish:
    name: Trigger crates.io publish
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml -f dry_run=false
          echo "publish.yml dispatched for $GITHUB_REF_NAME"
