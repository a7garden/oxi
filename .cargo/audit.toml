# oxicode cargo-audit configuration
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║  UPGRADE TRACKER — When extism ≥ 1.22 (wasmtime ≥ 43) ships,  ║
# ║  remove ALL wasmtime RUSTSEC-2026-* ignores below.              ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# All ignored advisories below are wasmtime 41.x vulnerabilities pulled in
# through extism 1.21 (WASM extension runtime). extism hard-pins wasmtime = "41"
# and no newer extism release exists yet that uses wasmtime >= 43.
#
# Risk assessment:
#   - These vulns are only exploitable when a MALICIOUS WASM plugin is loaded.
#   - oxicode extensions are user-installed and explicitly trusted.
#   - There is no untrusted plugin input path in oxicode.
#   - Removing extism would disable WASM extensions entirely, which is not acceptable.
#
# This file is the single source of truth for advisory ignores.
# deny.toml [advisories].ignore MUST be kept in sync with this list.

[advisories]
ignore = [
    # ── wasmtime 41.x (via extism 1.21) ──────────────────────────────

    # sandbox escape on aarch64 Cranelift (critical)
    "RUSTSEC-2026-0096",
    # Winch sandbox-escaping memory access (critical)
    "RUSTSEC-2026-0095",
    # host data leakage with 64-bit tables and Winch (low)
    "RUSTSEC-2026-0086",
    # panic transcoding misaligned UTF-16 (medium)
    "RUSTSEC-2026-0092",
    # heap OOB read UTF-16 transcoding (medium)
    "RUSTSEC-2026-0093",
    # panic on oversized table allocation (medium)
    "RUSTSEC-2026-0114",
    # segfault with f64x2.splat on Cranelift x86-64 (medium)
    "RUSTSEC-2026-0087",
    # pooling allocator data leakage (low)
    "RUSTSEC-2026-0088",
    # panic on Winch table.fill (medium)
    "RUSTSEC-2026-0089",
    # Winch table.grow return value masking (medium)
    "RUSTSEC-2026-0094",
    # panic lifting component model flags (medium)
    "RUSTSEC-2026-0085",
    # OOB write transcoding component model strings (medium)
    "RUSTSEC-2026-0091",
    # wasmtime 41.0.4 — type-index mixup between engines (medium).
    # Same extism 1.21 pin as the entries above.
    "RUSTSEC-2026-0222",

    # ── transitive dependencies (no fix available) ──────────────────

    # rsa ~0.9.10 — Marvin Attack timing sidechannel (medium)
    # Transitive via jsonschema → referencing. Server-side only.
    "RUSTSEC-2023-0071",

    # number_prefix — unmaintained, transitive via indicatif → self_update.
    # No known exploit. self_update has no maintained alternative.
    "RUSTSEC-2025-0119",

    # paste — unmaintained, transitive via oxibrowser-core → rav1e / boa_engine.
    # oxibrowser-core is pinned; paste is only used for CSS selector engine internals.
    "RUSTSEC-2024-0436",

    # ttf-parser 0.21.1 — unmaintained, transitive via fontdue 0.9.3 (latest)
    # → oxicode-snapcompact (snapcompact_render.rs rasterizer). fontdue pins
    # ttf-parser ^0.21; fontdue's newest release still requires it, so no
    # upgrade path exists. Informational (unmaintained), no known exploit.
    # Re-evaluate when fontdue ships a ttf-parser ≥0.22 or oxicode-snapcompact
    # switches rasterizers.
    "RUSTSEC-2026-0192",

    # quick-xml 0.23.1 — transitive via self_update → oxicode-cli.
    # RUSTSEC-2026-0194 (quadratic attribute-check DoS) and
    # RUSTSEC-2026-0195 (unbounded namespace-decl memory DoS).
    # Both require attacker-controlled XML. self_update is behind the
    # OPTIONAL non-default `self-update` feature and only parses GitHub's
    # own release manifests (trusted input). Unfixable upstream: every
    # self_update release incl. 1.0.0-rc.1 requires quick-xml ^0.38 (<0.41,
    # where the fix landed). Re-evaluate when self_update ships quick-xml ≥0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # bincode 1.3.3 — unmaintained (RUSTSEC-2025-0141), transitive via
    # syntect 5.x → oxicode-vtui. No safe upgrade; syntect pins bincode 1.3.3.
    "RUSTSEC-2025-0141",
    # yaml-rust 0.4.5 — unmaintained (RUSTSEC-2024-0320), transitive via
    # syntect 5.x → oxicode-vtui. yaml-rust2 is the maintained fork but
    # syntect has not switched.
    "RUSTSEC-2024-0320",
]
