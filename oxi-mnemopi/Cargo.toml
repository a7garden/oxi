[package]
name = "oxi-mnemopi"
version = "0.1.0"
description = "Local SQLite vector memory engine — Rust port of omp Mnemopi"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

# Ported from https://github.com/can1357/oh-my-pi (MIT) — packages/mnemopi/

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
parking_lot = "0.12"
lru = "0.16"
regex = "1"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[features]
default = []
# Local ONNX embeddings via fastembed-rs (adds ~50MB to binary).
local-embeddings = ["dep:fastembed"]
# Remote embedding API via reqwest.
remote-embeddings = ["dep:reqwest"]

[dependencies.fastembed]
version = "4"
optional = true

[dependencies.reqwest]
version = "0.12"
features = ["json", "rustls-tls"]
default-features = false
optional = true


[dev-dependencies]
tempfile = "3"