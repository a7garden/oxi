[package]
name = "oxi-mnemopi"
version = "0.63.0"
description = "Local SQLite vector memory engine — Rust port of omp Mnemopi"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

# Ported from https://github.com/can1357/oh-my-pi (MIT) — packages/mnemopi/

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "io-std", "io-util"] }
parking_lot = "0.12"
lru = "0.18"
regex = "1"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
tracing = "0.1"
arc-swap = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[[bin]]
name = "oxi-mnemopi-mcp"
path = "src/bin/oxi-mnemopi-mcp.rs"

[features]
default = []
# Local ONNX embeddings via fastembed-rs (adds ~50MB to binary).
local-embeddings = ["dep:fastembed"]
# Remote embedding API via reqwest (OpenAI-compatible /v1/embeddings).
remote-embeddings = ["dep:reqwest"]
# Remote LLM API via reqwest (OpenAI-compatible /v1/chat/completions).
# Shares the same reqwest dep as `remote-embeddings`.
remote-llm = ["dep:reqwest"]

[dependencies.fastembed]
version = "5"
optional = true

# `blocking` feature is required for the LLM/embedding HTTP calls; the
# crate's API is synchronous and wraps the blocking reqwest client. Both
# remote features share this single declaration.
[dependencies.reqwest]
version = "0.12"
features = ["json", "rustls-tls", "blocking"]
default-features = false
optional = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
