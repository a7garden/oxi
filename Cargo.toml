[workspace]
resolver = "2"
members = ["oxi-ai", "oxi-agent", "oxi-tui", "oxi-cli", "oxi-sdk"]
exclude = ["scripts"]

# NOTE: [patch.crates-io] was removed. Workspace members are auto-resolved
# by `members` above; explicit [patch] entries would block `cargo publish`.

[workspace.dependencies]
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
