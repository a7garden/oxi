[advisories]
# Vulnerabilities that are currently accepted.
# Each entry should have a brief note explaining why.

# fxhash - unmaintained, used indirectly via a3s-search/scraper/selectors
# No known exploit; tracked for future removal when a3s-search updates.
ignore = [
    "RUSTSEC-2025-0057",  # fxhash unmaintained
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
unlicensed = "deny"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
