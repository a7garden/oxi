[advisories]
# Vulnerabilities that are currently accepted.
# Each entry should have a brief note explaining why.
ignore = [
    # fxhash - unmaintained, transitive via a3s-search → scraper → selectors.
    # No known exploit. Re-evaluate when a3s-search updates its dependencies.
    "RUSTSEC-2025-0057",
    # number_prefix - unmaintained, transitive via indicatif → self_update → oxi-cli.
    # No known exploit. self_update has no maintained alternative; re-evaluate periodically.
    "RUSTSEC-2025-0119",
    # paste - unmaintained, transitive via oxibrowser-core → rav1e / boa_engine.
    # oxibrowser-core is pinned; paste is only used for CSS selector engine internals.
    # Re-evaluate when oxibrowser-core updates.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
unlicensed = "deny"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
