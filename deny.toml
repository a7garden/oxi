[advisories]
# Vulnerabilities that are currently accepted.
# Each entry should have a brief note explaining why.
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║  SOURCE OF TRUTH: .cargo/audit.toml.                             ║
# ║  When extism ≥ 1.22 (wasmtime ≥ 43) ships, remove all            ║
# ║  RUSTSEC-2026-* entries below AND in audit.toml.                  ║
# ║                                                                  ║
# ║  If you update this list, mirror the change in audit.toml,       ║
# ║  or run scripts/sync-audit-ignores.sh (TBD).                     ║
# ╚══════════════════════════════════════════════════════════════════╝
ignore = [
    # wasmtime 41.0.4 — pinned by extism 1.21.0 (no fixed version available).
    # All CVEs are sandbox-constrained; oxi does not execute untrusted Wasm.
    # Re-evaluate when extism ships a newer wasmtime.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",
    # rsa ~0.9.10 — transitive via jsonschema → referencing → referencing
    # No safe upgrade; rsa is only used server-side in schema validation.
    # Network timing attack requires attacker on the same network path.
    "RUSTSEC-2023-0071",
    # number_prefix - unmaintained, transitive via indicatif → self_update → oxi-cli.
    # No known exploit. self_update has no maintained alternative; re-evaluate periodically.
    "RUSTSEC-2025-0119",
    # paste - unmaintained, transitive via oxibrowser-core → rav1e / boa_engine.
    # oxibrowser-core is pinned; paste is only used for CSS selector engine internals.
    # Re-evaluate when oxibrowser-core updates.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",  # Boost Software License — OSI-approved, permissive (xxhash-rust via oxi-hashline)
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

# Targeted exceptions. These do NOT broaden the global allow list above;
# they apply only to the named crate at the named version.
#
# libfuzzer-sys is a fuzzing-only binding (links LLVM's libFuzzer). In our
# graph it reaches us transitively as:
#   oxi-cli → oxibrowser-core → image (avif feature) → ravif → rav1e → libfuzzer-sys
# rav1e gates it on `cfg(fuzzing)`, so the crate is never linked into the
# runtime binary. The license is `(MIT OR Apache-2.0) AND NCSA` — NCSA is a
# permissive, OSI-approved, FSF-Free license, so we whitelist it for this
# single transitive crate instead of expanding the global allow list.
[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "*"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# bitflags 1.x is pulled in by the legacy inotify 0.9.6, which is itself a
# transitive of notify 6.1.1. The rest of the tree uses bitflags 2.x.
# Unifying would require either bumping notify to ≥ 7 (API changes) or
# patching oxibrowser-core's image dependency — both out of scope for a
# lint config change. Skip the duplicate for this single legacy version.
[[bans.skip]]
name = "bitflags"
version = "1.3.2"
reason = "Transitive via inotify 0.9.6 ← notify 6.1.1 ← oxi-cli. inotify 0.10+ unifies to bitflags 2, but requires notify 7+ (breaking). Suppress for this single legacy version."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
