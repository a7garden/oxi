[package]
name = "oxi-ai"
version = "0.25.2"
edition = "2021"
description = "Unified LLM API — multi-provider streaming interface for AI coding assistants"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "llm", "openai", "anthropic", "claude"]
categories = ["api-bindings", "asynchronous"]
exclude = ["target/", "benches/"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AWS SigV4 signing
hmac = "0.12"
url = "2"

# JSON Schema validation
jsonschema = "0.26"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = { workspace = true }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
dirs = "5"

# File locking (fs2 for cross-platform flock, raii_flock for RAII guards)
fs2 = "0.4"
raii_flock = "0.2"
base64 = "0.22"
digest = "0.10"
sha2 = "0.10"
signature = "2.2"
pkcs8 = "0.10"
rsa = { version = "0.9", features = ["pem"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "token_estimation"
harness = false

[[bench]]
name = "sse_parsing"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
