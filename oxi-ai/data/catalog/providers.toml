# oxi Built-in Provider Catalog
#
# This file is the single source of truth for provider metadata.
# It is loaded at build time via `include_str!` and validated by serde.
#
# Schema:
#   [[provider]]
#   id              = "anthropic"          # canonical name
#   display_name    = "Anthropic"          # human-readable
#   aliases         = ["anthropic"]        # alternative names that resolve to this id
#   api             = "anthropic-messages" # Api enum variant
#   env_key         = "ANTHROPIC_API_KEY"  # primary env var
#   extra_env_keys  = []                   # fallback env vars
#   base_url        = "https://..."        # default base URL ("" = computed at runtime)
#   auth_method     = "x-api-key"          # bearer | x-api-key | api-key | none
#   extra_headers   = []                   # static HTTP headers
#   category        = "primary"            # primary | chinese | enterprise | open | coding | cloud | specialized | local
#   description     = "..."                # one-line description
#   default_enabled = true                 # whether enabled by default
#
# Field naming matches the Rust `BuiltinProvider` struct in src/providers/register_builtins.rs.
# The provider factory in create_builtin_provider() consumes this data directly.

