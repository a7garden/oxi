[package]
name = "oxi"
version = "0.1.0-alpha"
edition = "2021"
description = "Terminal-based AI coding assistant — multi-provider, streaming-first, extensible"
readme = "README.md"
license = "MIT"
authors = ["Won <won@mariozechner.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "coding", "assistant", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["target/", "benches/"]

[[bin]]
name = "oxi"
path = "src/main.rs"

[dependencies]
oxi-ai = { version = "0.1.0-alpha", path = "../oxi-ai" }
oxi-agent = { version = "0.1.0-alpha", path = "../oxi-agent" }
oxi-tui = { version = "0.1.0-alpha", path = "../oxi-tui" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
crossterm = "0.27"

# Dynamic loading for extensions
libloading = "0.8"
tempfile = "3"
once_cell = "1"
regex = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"