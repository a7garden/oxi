[package]
name = "oxi-cli"
version = "0.1.7-alpha"
edition = "2021"
description = "Terminal-based AI coding assistant — multi-provider, streaming-first, extensible"
readme = "README.md"
license = "MIT"
authors = ["Won <won@mariozechner.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "coding", "assistant", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["target/", "benches/"]

[[bin]]
name = "oxi"
path = "src/main.rs"

[lib]
name = "oxi"
path = "src/lib.rs"

[dependencies]
oxi-ai = { version = "0.1.7-alpha", path = "../oxi-ai" }
oxi-agent = { version = "0.1.7-alpha", path = "../oxi-agent" }
oxi-tui = { version = "0.1.7-alpha", path = "../oxi-tui" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
crossterm = "0.27"
base64 = "0.22"
async-trait = "0.1"
lazy_static = "1.4"
rand = "0.8"
sha2 = "0.10"
url = "2"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Dynamic loading for extensions
libloading = "0.8"
tempfile = "3"
once_cell = "1"
regex = "1"
# HTTP client for version check
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_yaml = "0.9"

# OAuth support
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"