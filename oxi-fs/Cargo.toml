[package]
name = "oxi-fs"
version = "0.26.2"
edition = "2021"
description = "File-based port implementations for oxi-sdk — adapter for the home-directory convention"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["oxi", "fs", "port", "adapter", "persistence"]
categories = ["filesystem", "api-bindings"]
exclude = ["target/"]

[dependencies]
oxi-sdk = { version = "0.26.2", path = "../oxi-sdk" }

# Async runtime
tokio = { version = "1", features = ["fs", "sync", "rt", "macros"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

# Identifiers & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# File system & paths
dirs = "5"
walkdir = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"

# Concurrency
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
