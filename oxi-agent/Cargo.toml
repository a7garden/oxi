[package]
name = "oxi-agent"
version = "0.1.0"
edition = "2021"
description = "Agent runtime layer built on oxi-ai"
license = "MIT"

[dependencies]
oxi-ai = { path = "../oxi-ai" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
parking_lot = "0.12"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
async-stream = "0.3"
