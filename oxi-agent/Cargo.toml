[package]
name = "oxi-agent"
version = "0.1.0"
edition = "2021"
description = "Agent runtime for oxi"
readme = "README.md"
license = "MIT"
authors = ["oxi contributors"]

[dependencies]
oxi-ai = { path = "../oxi-ai" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
