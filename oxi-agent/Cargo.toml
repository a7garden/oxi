[package]
name = "oxi-agent"
version = "0.39.0"
edition.workspace = true
rust-version.workspace = true
description = "Agent runtime with tool-calling loop for AI coding assistants"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "agent", "tools", "llm"]
categories = ["development-tools", "asynchronous"]
exclude = ["target/", "benches/"]

[dependencies]
oxi-ai = { version = "0.39.0", path = "../oxi-ai" }
oxi-hashline = { version = "0.39.0", path = "../oxi-hashline" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
parking_lot = "0.12"
anyhow = "1"
thiserror = { workspace = true }
regex = "1"
glob = "0.3"
base64 = "0.22"
dirs = "6"
unicode-normalization = "0.1"
reqwest = { version = "0.12", features = ["json"] }
oxibrowser = { version = "0.15", default-features = false }
async-trait = "0.1"
oxibrowser-core = { version = "0.15", optional = true }
serde_yaml = "0.9"

[features]
default = []
native-browser = ["oxibrowser-core"]

[dev-dependencies]
async-stream = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
