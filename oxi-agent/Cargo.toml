[package]
name = "oxi-agent"
version = "0.1.0-alpha"
edition = "2021"
description = "Agent runtime layer built on oxi-ai"
readme = "README.md"
license = "MIT"
authors = ["oxi contributors"]

[dependencies]
oxi-ai = { version = "0.1.0-alpha", path = "../oxi-ai" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
regex = "1"

[dev-dependencies]
tokio-test = "0.4"
async-stream = "0.3"
tempfile = "3"
