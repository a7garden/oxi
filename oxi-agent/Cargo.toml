[package]
name = "oxi-agent"
version = "0.24.0"
edition = "2021"
description = "Agent runtime with tool-calling loop for AI coding assistants"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "agent", "tools", "llm"]
categories = ["development-tools", "asynchronous"]
exclude = ["target/", "benches/"]

[dependencies]
oxi-ai = { version = "0.24.0", path = "../oxi-ai" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
parking_lot = "0.12"
anyhow = "1"
thiserror = { workspace = true }
regex = "1"
glob = "0.3"
base64 = "0.22"
dirs = "5"
unicode-normalization = "0.1"
reqwest = { version = "0.12", features = ["json"] }
a3s-search = { version = "1.2.3", default-features = false }
oxibrowser-core = { version = "0.11", optional = true }
serde_yaml = { version = "0.9", optional = true }

[features]
default = []
native-browser = ["oxibrowser-core", "serde_yaml"]

[dev-dependencies]
tokio-test = "0.4"
async-stream = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
