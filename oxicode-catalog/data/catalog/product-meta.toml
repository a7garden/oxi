# oxicode Product Metadata — extra HTTP headers for provider API requests.
#
# models.dev does not know oxicode-specific identifiers (e.g., HTTP-Referer for
# OpenRouter ranking, X-Cerebras-3rd-Party-Integration for Cerebras). This
# file provides them for the subset of providers that require them.
#
# Entries are keyed by models.dev provider id. The materialize step merges
# these headers into BuiltinProviderEntry.extra_headers.
#
# Data © models.dev (MIT) — these headers are oxicode product metadata only.

[[provider]]
id = "cerebras"
extra_headers = [["X-Cerebras-3rd-Party-Integration", "opencode"]]

[[provider]]
id = "cloudflare-ai-gateway"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

[[provider]]
id = "google-vertex-anthropic"
extra_headers = [["anthropic-version", "vertex-2023-10-16"]]

[[provider]]
id = "kilo"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

[[provider]]
id = "llmgateway"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

[[provider]]
id = "nvidia"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

[[provider]]
id = "openrouter"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

[[provider]]
id = "vercel"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

[[provider]]
id = "zenmux"
extra_headers = [["HTTP-Referer", "https://oxicode.dev/"], ["X-Title", "oxicode"]]

# OAuth metadata for `authorization_code` flow.
#
# Source of truth for `provider_oauth::spec_for`. Empty/missing block per
# provider = key-only. PKCE is public-client only — no `client_secret` field
# is permitted by the parser.
[providers.openai.oauth]
client_id     = "app-OxQ2ZoRxwMh6l3V7eNbC"
auth_url      = "https://auth.openai.com/oauth/authorize"
token_url     = "https://auth.openai.com/oauth/token"
scopes        = ["openid", "profile", "email", "offline_access"]
redirect_path = "/callback"
use_pkce      = true

[providers.anthropic.oauth]
client_id     = "oxicode-cli"
auth_url      = "https://console.anthropic.com/oauth/authorize"
token_url     = "https://console.anthropic.com/oauth/token"
scopes        = ["user:profile", "user:inference", "offline_access"]
redirect_path = "/callback"
use_pkce      = true
