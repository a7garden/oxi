[package]
name = "oxi-sdk"
version = "0.34.0"
edition.workspace = true
rust-version.workspace = true
description = "oxi AI agent SDK — build isolated, multi-agent AI systems"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "agent", "sdk", "llm", "multi-agent"]
categories = ["api-bindings", "development-tools"]
exclude = ["target/"]

[dependencies]
oxi-ai = { version = "0.34.0", path = "../oxi-ai" }
oxi-agent = { version = "0.34.0", path = "../oxi-agent" }
async-trait = "0.1"
# Re-exported under the `native-browser` feature so downstream consumers
# can match on `BrowserEvent` variants without depending on oxibrowser-core
# directly.
oxibrowser-core = { version = "0.15.0", optional = true }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
fastrand = "2"
tracing = "0.1"
serde_yaml = "0.9"
dirs = "6"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"

# File-based port impls (fs/ sub-module). Always available in default build.
toml = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
fastrand = "2"


[features]
default = []
native-browser = ["oxi-agent/native-browser", "dep:oxibrowser-core"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
