[package]
name = "oxi-sdk"
version = "0.23.0"
edition = "2021"
description = "oxi AI agent SDK — build isolated, multi-agent AI systems"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "agent", "sdk", "llm", "multi-agent"]
categories = ["api-bindings", "development-tools"]
exclude = ["target/"]

[dependencies]
oxi-ai = { version = "0.23.0", path = "../oxi-ai" }
oxi-agent = { version = "0.23.0", path = "../oxi-agent" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
fastrand = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
fastrand = "2"


[features]
default = []
native-browser = ["oxi-agent/native-browser"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
