[package]
name = "oxi-sdk"
version = "0.15.2"
edition = "2021"
description = "oxi AI agent SDK — build isolated, multi-agent AI systems"
readme = "README.md"
license = "MIT"
authors = ["Won <won@mariozechner.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "agent", "sdk", "llm", "multi-agent"]
categories = ["api-bindings", "development-tools"]
exclude = ["target/"]

[dependencies]
oxi-ai = { version = "0.15.0" }
oxi-agent = { version = "0.15.1" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
