[package]
name = "oxi-vendor-grok-pager"
version = "0.2.102"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Already vendored — path refs
oxi-vendor-tty-utils = { path = "../oxi-vendor-tty-utils" }
oxi-vendor-grok-pager-render = { path = "../oxi-vendor-grok-pager-render" }
oxi-vendor-grok-markdown = { path = "../oxi-vendor-grok-markdown" }
oxi-vendor-grok-mermaid = { path = "../oxi-vendor-grok-mermaid" }
oxi-vendor-ratatui-textarea = { path = "../oxi-vendor-ratatui-textarea" }
oxi-vendor-ratatui-inline = { path = "../oxi-vendor-ratatui-inline" }

# External deps (inlined from grok workspace versions)
dunce = "1"
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
textwrap = "0.16"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
strip-ansi-escapes = "0.2.1"
enum_delegate = "0.2"
syntect = "5.3"
similar = "2.7"
indexmap = { version = "2", features = ["serde"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = { version = "0.22", features = ["serde"] }
ansi-to-tui = "7.0"
derive_more = { version = "2", features = ["deref", "deref_mut"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.9"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "signal", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
obfstr = "0.4"
nucleo = "0.5"
portable-pty = "0.9"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
shellexpand = "3.1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
urlencoding = "2"
url = "2"
parking_lot = "0.12"
chrono = "0.4"
flate2 = "1"
tar = "0.4"
wait-timeout = "0.2"
backon = "1"

# Commented out — need vendoring
# xai-grok-shell
# xai-grok-agent
# xai-grok-tools
# xai-grok-config
# xai-grok-workspace
# xai-grok-telemetry
# xai-grok-voice
# xai-grok-update
# xai-grok-plugin-marketplace
# xai-hooks-plugins-types
# xai-grok-sandbox
# xai-grok-announcements
# xai-acp-lib
# xai-file-utils
# xai-fast-worktree
# xai-token-estimation
# xai-prompt-queue
# xai-grok-version
# xai-crash-handler

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[features]
default = []
