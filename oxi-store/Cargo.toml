[package]
name = "oxi-store"
version = "0.11.0"
edition = "2021"
description = "Shared persistent state for oxi — sessions, settings, auth, model registry"
readme = "README.md"
license = "MIT"
authors = ["Won <won@mariozechner.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "agent", "session", "settings", "auth"]
categories = ["development-tools", "asynchronous"]
exclude = ["target/"]

[dependencies]
oxi-ai = { version = "0.11.0", path = "../oxi-ai" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = { workspace = true }

# File & paths
dirs = "5"
walkdir = "2"
regex = "1"
parking_lot = "0.12"

# Identifiers & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"