[package]
name = "oxi-tui"
version = "0.58.0"
edition.workspace = true
rust-version.workspace = true
description = "Terminal UI rendering pipeline and widget library for oxi (v2 — terminal-first pipeline)"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["tui", "terminal", "ui", "ratatui"]
categories = ["command-line-interface", "gui"]
exclude = ["target/"]

[dependencies]
# Terminal rendering
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-core = "0.1"
crossterm = "0.29"

# Serialization (for theme TOML loading)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
parking_lot = "0.12"
unicode-width = "0.2"
unicode-segmentation = "1"
supports-color = { workspace = true }
pulldown-cmark = "0.13"
linkify = { workspace = true }

# Syntax highlighting (optional — opt-in via `features = ["syntax"]`)
# Syntect provides a rich TextMate grammar + theme ecosystem for code blocks.
# Without the feature, SyntaxHighlighter falls back to plain monospace lines.
syntect = { version = "5", optional = true }

[features]
# syntax feature: enables syntect-based code highlighting. Opt-in to keep the
# binary small; off by default.
syntax = ["dep:syntect"]

[dev-dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
