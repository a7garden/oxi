[package]
name = "oxi-tui"
version = "0.57.0"
edition.workspace = true
rust-version.workspace = true
description = "Terminal UI widgets and theme system for oxi, built on ratatui"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["tui", "terminal", "ui", "ratatui"]
categories = ["command-line-interface", "gui"]
exclude = ["target/"]

[dependencies]
# Terminal UI
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
crossterm = "0.29"
tui-markdown = { version = "0.3", default-features = false, features = [] }
strum = { version = "0.28", features = ["derive"] }
supports-color = { workspace = true }
nucleo = { workspace = true }
linkify = { workspace = true }
regex = { workspace = true }
syntect = { workspace = true, optional = true }

# Serialization (for theme file loading)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"

# Utilities
parking_lot = "0.12"
unicode-width = "0.2"
unicode-segmentation = "1"
base64 = "0.22"
dirs = "6"
pulldown-cmark = "0.13.3"

[features]
# syntax feature: enables syntect-based tmTheme code highlighting.
# Opt-in to keep the binary small; off by default.
syntax = ["dep:syntect"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
