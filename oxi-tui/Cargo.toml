[package]
name = "oxi-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for oxi"
readme = "README.md"
license = "MIT"
authors = ["oxi contributors"]

[dependencies]
# Terminal UI
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
parking_lot = "0.12"
unicode-width = "0.1"
