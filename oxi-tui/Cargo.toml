[package]
name = "oxi-tui"
version = "0.4.0"
edition = "2021"
description = "Terminal UI framework with differential rendering, themes, and components"
readme = "README.md"
license = "MIT"
authors = ["Won <won@mariozechner.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["tui", "terminal", "ui", "rendering"]
categories = ["command-line-interface", "gui"]
exclude = ["target/", "benches/"]

[dependencies]
# Terminal UI
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Encoding
base64 = "0.22"

# Image processing
image = "0.25"

# Utilities
parking_lot = "0.12"
unicode-width = "0.1"
unicode-segmentation = "1.11"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tui_rendering"
harness = false
