[package]
name = "oxi-tui"
version = "0.6.3"
edition = "2021"
description = "Terminal UI widgets and theme system for oxi, built on ratatui"
readme = "README.md"
license = "MIT"
authors = ["Won <won@mariozechner.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["tui", "terminal", "ui", "ratatui"]
categories = ["command-line-interface", "gui"]
exclude = ["target/"]

[dependencies]
# Terminal UI
ratatui = "0.30"

# Serialization (for theme file loading)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"

# Utilities
parking_lot = "0.12"
unicode-width = "0.1"
