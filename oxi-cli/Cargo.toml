[package]
name = "oxi-cli"
version = "0.25.4"
edition = "2021"
description = "Terminal-based AI coding assistant — multi-provider, streaming-first, extensible"
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["ai", "coding", "assistant", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["target/", "benches/"]

[[bin]]
name = "oxi"
path = "src/main.rs"

[lib]
name = "oxi"
path = "src/lib.rs"

[dependencies]
oxi-ai = { version = "0.25.3", path = "../oxi-ai" }
oxi-agent = { version = "0.25.3", path = "../oxi-agent" }
oxi-store = { version = "0.25.3", path = "../oxi-store" }
oxi-tui = { version = "0.25.3", path = "../oxi-tui" }
oxi-sdk = { version = "0.25.3", path = "../oxi-sdk" }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = { workspace = true }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
unicode-width = "0.2"
base64 = "0.22"
async-trait = "0.1"
lazy_static = "1.4"
rand = "0.8"
sha2 = "0.10"
url = "2"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Dynamic loading for extensions
libloading = "0.8"
extism = { version = "1.21", default-features = false }
tempfile = "3"
once_cell = "1"
regex = "1"
# Semver
semver = { version = "1", features = ["serde"] }

# HTTP client for version check
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Self-update (optional)
self_update = { version = "0.41", features = ["archive-tar", "compression-flate2"], optional = true }
serde_yaml = "0.9"

# OAuth support
urlencoding = "2.1"

# Filesystem watching
notify = "6"

# Archive extraction for tools-manager
flate2 = "1"
tar = "0.4"
zip = "2"

# Unix primitives for SIGTSTP
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["self-update"]
self-update = ["dep:self_update"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"