[package]
name = "oxi-sandbox"
version = "0.57.0"
edition.workspace = true
rust-version.workspace = true
description = "Sandbox profile abstraction for oxi agent."
readme = "README.md"
license = "MIT"
authors = ["a7garden <a7garden@icloud.com>"]
repository = "https://github.com/a7garden/oxi"
keywords = ["sandbox", "bwrap", "agent", "isolation"]
categories = ["development-tools", "os"]
exclude = ["target/"]

[features]
default = []
linux-bwrap = ["dep:nono"]
macos-sandbox-exec = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
nono = { version = "0.1", optional = true }
